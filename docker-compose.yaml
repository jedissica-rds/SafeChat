services:
  postgres:
    image: postgres:17
    container_name: camellia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camellia_db
      POSTGRES_USER: camellia_user
      POSTGRES_PASSWORD: camellia12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camellia_user -d camellia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
